name: Generate Posts JSON

on:
  push:
    branches:
      - main
    paths:
      - "posts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-posts.yml"
  pull_request:
    paths:
      - "posts/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-posts-index
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate posts (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run check:posts

      - name: Generate posts.json
        if: github.event_name != 'pull_request'
        run: npm run generate:posts

      - name: Commit updated index
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update posts index"
            git pull --rebase origin main
            git push
          else
            echo "posts.json is already up to date."
          fi